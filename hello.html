<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Merigoround App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .card-icon {
            font-size: 3rem;
            color: #28a745;
        }
        .card-link {
            text-decoration: none;
            color: #007bff;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <h1 class="mb-4">Merigoround Dashboard</h1>
        <div class="row">
            <!-- Members Card -->
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-users card-icon"></i>
                        <h5 class="card-title mt-3">Members</h5>
                        <p class="card-text">View all members</p>
                        <a href="members.html" class="card-link">Go to Members Table</a>
                    </div>
                </div>
            </div>
            
            <!-- Savings Card -->
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-piggy-bank card-icon"></i>
                        <h5 class="card-title mt-3">Savings</h5>
                        <p class="card-text">View savings records</p>
                        <a href="savings.html" class="card-link">Go to Savings Table</a>
                    </div>
                </div>
            </div>

            <!-- Loans Card -->
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-hand-holding-usd card-icon"></i>
                        <h5 class="card-title mt-3">Loans</h5>
                        <p class="card-text">View loan details</p>
                        <a href="loans.html" class="card-link">Go to Loans Table</a>
                    </div>
                </div>
            </div>

            <!-- Fines Card -->
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-exclamation-triangle card-icon"></i>
                        <h5 class="card-title mt-3">Fines</h5>
                        <p class="card-text">View fines issued</p>
                        <a href="fines.html" class="card-link">Go to Fines Table</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
