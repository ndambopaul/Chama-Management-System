{% extends "base.html" %}

{% block additional_css %}


    <style>
      .card-icon {
      font-size: 3rem;
      color: #28a745;
  }
  .card-link {
      text-decoration: none;
      color: #007bff;
  }
    </style>
{% endblock additional_css %}

{% block content %}
<div class="row mt-3">
  <!-- Members Card -->
  <div class="col-md-3">
      <div class="card text-center">
          <div class="card-body">
              <i class="fas fa-users card-icon"></i>
              <h5 class="card-title mt-3">Members</h5>
              <p class="card-text">View all members</p>
              <a href="{% url 'members' %}" class="card-link">Go to Members</a>
          </div>
      </div>
  </div>
  
  <!-- Savings Card -->
  <div class="col-md-3">
      <div class="card text-center">
          <div class="card-body">
              <i class="fas fa-piggy-bank card-icon"></i>
              <h5 class="card-title mt-3">Savings</h5>
              <p class="card-text">View savings records</p>
              <a href="{% url 'savings' %}" class="card-link">Go to Savings</a>
          </div>
      </div>
  </div>

  <!-- Loans Card -->
  <div class="col-md-3">
      <div class="card text-center">
          <div class="card-body">
              <i class="fas fa-hand-holding-usd card-icon"></i>
              <h5 class="card-title mt-3">Loans</h5>
              <p class="card-text">View loan details</p>
              <a href="{% url 'loans' %}" class="card-link">Go to Loans</a>
          </div>
      </div>
  </div>

  <!-- Fines Card -->
  <div class="col-md-3">
      <div class="card text-center">
          <div class="card-body">
              <i class="fas fa-exclamation-triangle card-icon"></i>
              <h5 class="card-title mt-3">Fines</h5>
              <p class="card-text">View fines issued</p>
              <a href="{% url 'fines' %}" class="card-link">Go to Fines</a>
          </div>
      </div>
  </div>
</div>

{% endblock %}
